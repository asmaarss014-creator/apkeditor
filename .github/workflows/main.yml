name: Dara Git Unzipper

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dara-git-unzipper:
    name: Dara Git Unzipper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Required Tools
        shell: bash
        run: |
          set +e
          sudo apt-get update -qq || true
          sudo apt-get install -y \
            unzip \
            zip \
            tar \
            gzip \
            bzip2 \
            xz-utils \
            p7zip-full \
            unrar \
            lz4 \
            zstd \
            cabextract \
            cpio \
            arj \
            rpm2cpio \
            file \
            git || true

      - name: Create Extraction Folder
        run: mkdir -p extracted

      - name: Extract Supported Archives
        shell: bash
        run: |
          set +e

          find . -type f | while read -r file
          do
            echo "Checking: $file"

            case "$file" in

              *.zip)
                unzip -o "$file" -d extracted >/dev/null 2>&1 || true
                ;;

              *.tar)
                tar -xf "$file" -C extracted >/dev/null 2>&1 || true
                ;;

              *.tar.gz|*.tgz)
                tar -xzf "$file" -C extracted >/dev/null 2>&1 || true
                ;;

              *.tar.bz2)
                tar -xjf "$file" -C extracted >/dev/null 2>&1 || true
                ;;

              *.tar.xz)
                tar -xJf "$file" -C extracted >/dev/null 2>&1 || true
                ;;

              *.7z)
                7z x "$file" -oextracted >/dev/null 2>&1 || true
                ;;

              *.rar)
                unrar x -o+ "$file" extracted >/dev/null 2>&1 || true
                ;;

              *.gz)
                gunzip -kf "$file" >/dev/null 2>&1 || true
                ;;

              *.bz2)
                bunzip2 -kf "$file" >/dev/null 2>&1 || true
                ;;

              *.xz)
                unxz -kf "$file" >/dev/null 2>&1 || true
                ;;

              *.lz4)
                lz4 -d "$file" >/dev/null 2>&1 || true
                ;;

              *.zst)
                zstd -d "$file" >/dev/null 2>&1 || true
                ;;

              *.cab)
                cabextract "$file" -d extracted >/dev/null 2>&1 || true
                ;;

              *.cpio)
                (cd extracted && cpio -id < "../$file") >/dev/null 2>&1 || true
                ;;

              *.arj)
                arj x "$file" extracted >/dev/null 2>&1 || true
                ;;

              *.rpm)
                rpm2cpio "$file" | (cd extracted && cpio -id) >/dev/null 2>&1 || true
                ;;

              *)
                ;;
            esac
          done

      - name: Move Extracted Files
        shell: bash
        run: |
          set +e
          shopt -s dotglob nullglob
          cp -rf extracted/* . >/dev/null 2>&1 || true
          rm -rf extracted

      - name: Remove Empty Folders
        shell: bash
        run: |
          set +e
          find . -type d -empty -delete >/dev/null 2>&1 || true

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "Asmaarss014-Creator"
          git config --global user.email "Asmaarss014@gmail.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Commit Changes
        shell: bash
        run: |
          set +e

          git add -A

          if git diff --cached --quiet
          then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Dara Git Unzipper automatic extraction"

      - name: Push Changes
        shell: bash
        run: |
          set +e

          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

          if [ -n "$BRANCH" ]
          then
            git push origin "$BRANCH" >/dev/null 2>&1 || echo "Push skipped."
          fi
